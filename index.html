<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harmonic ADSR Analyzer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="control-panel" aria-label="분석 설정">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">A</div>
          <div>
            <h1>Harmonic ADSR Analyzer</h1>
            <p>가산합성을 위한 배음 주파수와 ADSR 분석기</p>
          </div>
        </div>

        <label class="drop-zone" id="dropZone">
          <input id="fileInput" type="file" accept="audio/*" />
          <span class="drop-title">오디오 파일 선택</span>
          <span class="drop-copy">WAV, MP3, AIFF, M4A 등을 넣어 분석합니다.</span>
        </label>

        <section class="panel-section">
          <div class="section-title">
            <span>Source</span>
            <span id="sourceDuration">00:00.000</span>
          </div>
          <div class="meta-grid">
            <div>
              <span>파일</span>
              <strong id="fileName">대기 중</strong>
            </div>
            <div>
              <span>샘플레이트</span>
              <strong id="sampleRate">-</strong>
            </div>
            <div>
              <span>채널</span>
              <strong id="channelCount">-</strong>
            </div>
            <div>
              <span>기음</span>
              <strong id="fundamentalReadout">-</strong>
            </div>
          </div>
        </section>

        <section class="panel-section">
          <div class="section-title">
            <span>Analysis</span>
            <span id="analysisStatus">준비</span>
          </div>
          <label class="field">
            <span>기음 수동 지정</span>
            <input id="manualF0" type="number" min="20" max="5000" step="0.01" placeholder="자동" />
          </label>
          <label class="field">
            <span>최대 배음 수 <b id="harmonicCountLabel">24</b></span>
            <input id="harmonicCount" type="range" min="4" max="48" value="24" />
          </label>
          <label class="field">
            <span>검출 민감도 <b id="sensitivityLabel">3%</b></span>
            <input id="sensitivity" type="range" min="1" max="10" value="3" />
          </label>
          <div class="button-row">
            <button id="analyzeButton" class="primary-button" type="button" disabled>분석</button>
            <button id="playButton" class="icon-button" type="button" title="재생" aria-label="재생" disabled>▶</button>
            <button id="stopButton" class="icon-button" type="button" title="정지" aria-label="정지" disabled>■</button>
          </div>
        </section>

        <section class="panel-section">
          <div class="section-title">
            <span>Export</span>
          </div>
          <div class="button-row">
            <button id="csvButton" type="button" disabled>CSV</button>
            <button id="jsonButton" type="button" disabled>JSON</button>
          </div>
        </section>
      </aside>

      <section class="workspace">
        <section class="analyzer-panel main-frequency-card" aria-live="polite">
          <div>
            <span class="metric-label">Main Frequency / Fundamental</span>
            <strong id="mainFrequencyValue">-</strong>
          </div>
          <div class="main-frequency-meta">
            <span id="mainFrequencyNote">-</span>
            <span id="mainFrequencyMethod">분석 대기</span>
          </div>
        </section>

        <div class="top-grid">
          <section class="analyzer-panel waveform-panel">
            <div class="panel-heading">
              <h2>Waveform</h2>
              <span id="trimReadout">활성 구간: -</span>
            </div>
            <canvas id="waveCanvas" aria-label="파형 분석 캔버스"></canvas>
          </section>

          <section class="analyzer-panel spectrum-panel">
            <div class="panel-heading">
              <h2>Spectrum</h2>
              <span id="spectrumReadout">배음 마커 대기</span>
            </div>
            <canvas id="spectrumCanvas" aria-label="스펙트럼 분석 캔버스"></canvas>
          </section>
        </div>

        <section class="analyzer-panel table-panel">
          <div class="panel-heading">
            <h2>Harmonics</h2>
            <span id="harmonicSummary">결과 없음</span>
          </div>
          <div class="table-head" aria-hidden="true">
            <span>Harmonic</span>
            <span>Freq</span>
            <span>Peak</span>
            <span>ADSR</span>
          </div>
          <div id="harmonicRows" class="harmonic-rows" aria-live="polite">
            <div class="empty-state">오디오를 넣고 분석을 누르면 배음별 결과가 표시됩니다.</div>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
